<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Orçamento</title>

    css/orcamento.css
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <h2>Orçamento</h2>

            <nav>
                #
                <a                #Resumo</a>
            </nav>
        </aside>

        <main class="content">

            <header>
                <h1>Controle de Orçamento</h1>
                <p>Cadastre orçamentos e acompanhe seus gastos</p>
            </header>

            <!-- RESUMO -->
            <section class="summary">

                <div class="card">
                    <h3>Orçamento Total</h3>
                    <p id="totalBudget">R$ 0,00</p>
                </div>

                <div class="card">
                    <h3>Total Gasto</h3>
                    <p id="totalSpent">R$ 0,00</p>
                </div>

                <div class="card">
                    <h3>Restante</h3>
                    <p id="remaining">R$ 0,00</p>
                </div>

            </section>

            <!-- MENSAGENS -->
            <p id="message"></p>

            <!-- FORMULÁRIOS -->
            <section class="forms">

                <!-- ORÇAMENTO -->
                <form id="budgetForm">

                    <h2>Novo Orçamento</h2>

                    <input
                        type="text"
                        id="budgetName"
                        placeholder="Nome do orçamento"
                        required
                    >

                    <input
                        type="number"
                        id="budgetAmount"
                        placeholder="Valor"
                        step="0.01"
                        required
                    >

                    <button type="submit">
                        Cadastrar
                    </button>

                </form>

                <!-- GASTOS -->
                <form id="expenseForm">

                    <h2>Novo Gasto</h2>

                    <select id="expenseBudget" required>
                        <option value="">
                            Selecione um orçamento
                        </option>
                    </select>

                    <input
                        type="text"
                        id="expenseDescription"
                        placeholder="Descrição do gasto"
                        required
                    >

                    <input
                        type="text"
                        id="expenseCategory"
                        placeholder="Categoria"
                    >

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Valor"
                        step="0.01"
                        required
                    >

                    <button type="submit">
                        Adicionar
                    </button>

                </form>

            </section>

            <!-- ORÇAMENTOS -->
            <section>

                <h2>Orçamentos cadastrados</h2>

                <div id="budgetList">

                    <!-- preenchido via JavaScript -->

                </div>

            </section>

        </main>

    </div>

  
   <script src="js/scriptOrcamento.js"></script>

</body>
</html>
